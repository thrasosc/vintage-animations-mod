# git-cliff configuration — generates changelog.md from Conventional Commits.
#
# The whole file is uploaded verbatim to CurseForge by `publishMods`, so it must contain
# ONLY the release being published. Generate it at release time with:
#
#     git-cliff --unreleased --tag v0.3 -o changelog.md
#
# Anything that is not a `feat:` or `fix:` (etc.) is dropped, so `chore:`/`build:`/`ci:`
# commits never reach players.

[changelog]
header = """
# Vintage Animations
"""
body = """
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%d/%m/%Y") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {{ commit.message | upper_first }}{% endfor %}
{% endfor %}"""
footer = """

[![BisectHosting](https://www.bisecthosting.com/images/CF/Vintage_Animations/MP_VintageAnimations_promo.webp)](https://bisecthosting.com/PixelDream)
"""
trim = false

[git]
conventional_commits = true
# Drop anything that does not match a parser below — keeps build noise out of the changelog.
filter_unconventional = true
filter_commits = true
protect_breaking_commits = true
topo_order = false
sort_commits = "oldest"

commit_parsers = [
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Changed" },
    { message = "^revert", group = "Reverted" },
    # Everything below is developer-facing only and never shown to players.
    { message = "^chore", skip = true },
    { message = "^build", skip = true },
    { message = "^ci", skip = true },
    { message = "^docs", skip = true },
    { message = "^style", skip = true },
    { message = "^test", skip = true },
]
