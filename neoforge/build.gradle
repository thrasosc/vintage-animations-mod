plugins {
    id 'com.github.johnrengelman.shadow'
    id 'me.modmuss50.mod-publish-plugin'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"
    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
    modImplementation "dev.architectury:architectury-neoforge:${rootProject.architectury_api_version}"
    modImplementation "dev.kosmx.player-anim:player-animation-lib-forge:${rootProject.player_anim_version}"
    modApi "me.shedaniel.cloth:cloth-config-neoforge:${rootProject.cloth_config_version}"
    // For compatibility support
    modCompileOnly "maven.modrinth:first-person-model:${rootProject.first_person_model_neoforge_version}"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}

publishMods {
    file = tasks.remapJar.archiveFile
    displayName = "Vintage Animations $project.version"
    version = project.version
    changelog = rootProject.file("changelog.md").text
    type = STABLE
    modLoaders.add("neoforge")

    // ./gradlew publishMods -PpublishDryRun stages the upload under build/publishMods/
    // instead of contacting CurseForge or Modrinth.
    dryRun = providers.gradleProperty("publishDryRun").present

    curseforge {
        projectId = "1134994"
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        minecraftVersions.add("1.21.1")
        // CurseForge rejects uploads with no environment tag (error 1021).
        // This mod is "environment": "client".
        client = true
        server = false
        requires("architectury-api", "playeranimator", "cloth-config")
    }

    modrinth {
        projectId = "yY9ix3J0"
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        minecraftVersions.add("1.21.1")
        requires("architectury-api", "playeranimator", "cloth-config")
    }
}
